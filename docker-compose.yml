name: serviceforotus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:9094
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:${KAFKA_PORT:-9092}
    ports:
      - "${KAFKA_PORT:-9092}:9094"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --brokers
      - kafka:9092
      - topic
      - create
      - ${KAFKA_TOPIC_ORDER_PAYMENT_RESULT:-order.payment.result}
      - --partitions
      - "1"
      - --replicas
      - "1"
      - --if-not-exists

  user-service:
    profiles: ["apps"]
    build:
      context: ./services/user-service
    environment:
      APP_NAME: user-service
      APP_PORT: 8000
      POSTGRES_DB: users_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/users_db
      JWT_SECRET_KEY: local-dev-secret
      BILLING_SERVICE_URL: http://billing-service:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/user-service:/app
    ports:
      - "${USER_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      billing-service:
        condition: service_started

  billing-service:
    profiles: ["apps"]
    build:
      context: ./services/billing-service
    environment:
      APP_NAME: billing-service
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/billing_db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/billing-service:/app
    ports:
      - "${BILLING_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    profiles: ["apps"]
    build:
      context: ./services/order-service
    environment:
      APP_NAME: order-service
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/orders_db
      BILLING_SERVICE_URL: http://billing-service:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_PAYMENT_RESULT_TOPIC: ${KAFKA_TOPIC_ORDER_PAYMENT_RESULT:-order.payment.result}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/order-service:/app
    ports:
      - "${ORDER_SERVICE_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      billing-service:
        condition: service_started

  notification-service:
    profiles: ["apps"]
    build:
      context: ./services/notification-service
    environment:
      APP_NAME: notification-service
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notifications_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_PAYMENT_RESULT_TOPIC: ${KAFKA_TOPIC_ORDER_PAYMENT_RESULT:-order.payment.result}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/notification-service:/app
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
