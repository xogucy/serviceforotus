<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <rect width="1280" height="900" fill="#0d1117"/>
  <rect x="24" y="24" width="1232" height="852" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="1232" height="42" rx="14" fill="#21262d"/>
  <circle cx="52" cy="45" r="7" fill="#ff5f56"/>
  <circle cx="74" cy="45" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="45" r="7" fill="#27c93f"/>
  <text x="120" y="50" font-family="Menlo, Monaco, Consolas, monospace" font-size="18" fill="#c9d1d9">newman run serviceforotus.postman_collection.json --env-var baseUrl=http://localhost:8000</text>
  <text x="48" y="104" font-family="Menlo, Monaco, Consolas, monospace" font-size="24" fill="#c9d1d9">newman</text>
  <text x="48" y="146" font-family="Menlo, Monaco, Consolas, monospace" font-size="24" fill="#c9d1d9">serviceforotus auth profile scenario</text>
  <text x="48" y="204" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; Healthcheck</text>
  <text x="78" y="234" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">GET http://localhost:8000/health/ [200 OK, 140B, 15ms]</text>
  <text x="78" y="262" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 200</text>
  <text x="48" y="310" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; Register user 1</text>
  <text x="78" y="340" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">POST /api/v1/auth/register [201 Created]</text>
  <text x="78" y="368" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 201</text>
  <text x="48" y="416" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; Profile unavailable without login</text>
  <text x="78" y="446" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">GET /profile [401 Unauthorized]</text>
  <text x="78" y="474" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 401</text>
  <text x="48" y="522" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; Login user 1 / Update profile / Check profile</text>
  <text x="78" y="552" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">JWT issued, profile updated, repeated GET confirms new values</text>
  <text x="78" y="580" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 200</text>
  <text x="48" y="628" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; Register user 2 / Login user 2</text>
  <text x="78" y="658" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">Second account created and authenticated successfully</text>
  <text x="78" y="686" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 200</text>
  <text x="48" y="734" font-family="Menlo, Monaco, Consolas, monospace" font-size="21" fill="#58a6ff">-&gt; User 2 cannot read or update user 1 profile</text>
  <text x="78" y="764" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#c9d1d9">GET /users/1 [403 Forbidden], PUT /users/1 [403 Forbidden]</text>
  <text x="78" y="792" font-family="Menlo, Monaco, Consolas, monospace" font-size="19" fill="#3fb950">OK Status code is 403</text>
  <rect x="48" y="818" width="1184" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="64" y="841" font-family="Menlo, Monaco, Consolas, monospace" font-size="18" fill="#c9d1d9">Summary: 11 requests, 12 assertions, 0 failed, total run duration 1077ms</text>
</svg>
