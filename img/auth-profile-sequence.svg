<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <rect width="1440" height="980" fill="#ffffff"/>
  <text x="720" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#111827">Sequence Diagram: register, login, profile access</text>

  <rect x="90" y="84" width="170" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="360" y="84" width="170" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="635" y="84" width="170" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <rect x="910" y="84" width="170" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="1185" y="84" width="170" height="48" rx="8" fill="#fee2e2" stroke="#dc2626"/>

  <text x="175" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">Client / Postman</text>
  <text x="445" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">Auth API</text>
  <text x="720" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">AuthService</text>
  <text x="995" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">UserService</text>
  <text x="1270" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">PostgreSQL</text>

  <line x1="175" y1="132" x2="175" y2="930" stroke="#94a3b8" stroke-dasharray="8 8"/>
  <line x1="445" y1="132" x2="445" y2="930" stroke="#94a3b8" stroke-dasharray="8 8"/>
  <line x1="720" y1="132" x2="720" y2="930" stroke="#94a3b8" stroke-dasharray="8 8"/>
  <line x1="995" y1="132" x2="995" y2="930" stroke="#94a3b8" stroke-dasharray="8 8"/>
  <line x1="1270" y1="132" x2="1270" y2="930" stroke="#94a3b8" stroke-dasharray="8 8"/>

  <line x1="175" y1="180" x2="445" y2="180" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="310" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">1. POST /api/v1/auth/register</text>

  <line x1="445" y1="230" x2="720" y2="230" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="582" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">2. register_user(RegisterRequest)</text>

  <line x1="720" y1="280" x2="995" y2="280" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="857" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">3. create_registered_user(dto, password_hash)</text>

  <line x1="995" y1="330" x2="1270" y2="330" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="1132" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">4. INSERT INTO users (..., password_hash)</text>

  <line x1="1270" y1="380" x2="445" y2="380" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="857" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">5. 201 Created + public user fields</text>

  <line x1="175" y1="450" x2="445" y2="450" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="310" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">6. POST /api/v1/auth/login</text>

  <line x1="445" y1="500" x2="720" y2="500" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="582" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">7. login_user(LoginRequest)</text>

  <line x1="720" y1="550" x2="995" y2="550" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="857" y="538" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">8. get_user_by_username(username)</text>

  <line x1="995" y1="600" x2="1270" y2="600" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="1132" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">9. SELECT user and password_hash</text>

  <line x1="1270" y1="650" x2="720" y2="650" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="995" y="638" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">10. verify password and create JWT(sub=user_id)</text>

  <line x1="720" y1="700" x2="175" y2="700" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="445" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">11. 200 OK + access_token</text>

  <line x1="175" y1="770" x2="445" y2="770" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="310" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">12. GET /profile with Bearer token</text>

  <line x1="445" y1="820" x2="720" y2="820" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="582" y="808" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">13. decode JWT, extract sub</text>

  <line x1="720" y1="870" x2="995" y2="870" stroke="#111827" marker-end="url(#arrow)"/>
  <text x="857" y="858" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#111827">14. load current user by id</text>

  <line x1="995" y1="920" x2="175" y2="920" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="582" y="908" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">15. return own profile or 403 for чужой user_id</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
